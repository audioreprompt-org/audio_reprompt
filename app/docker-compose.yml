services:
  # Servicio de Base de Datos (PostgreSQL + pgvector)
  db:
    build:
      context: ../db
      dockerfile: Dockerfile
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-postgres}
    ports:
      # Expone PG en el host para acceso local de desarrollo
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # Servicio Frontend (Vue/Nginx)
  frontend:
    # Construye a partir del Dockerfile en el directorio actual
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pasa la URL de la API al frontend en el proceso de build de Vite
        VITE_API_URL: ${VITE_API_URL}
    ports:
      # Mapea el puerto 80 del contenedor al puerto 5173 del host
      - "5173:80"
    depends_on:
      - backend
    # Reinicia si falla
    restart: always

  # Servicio Backend (FastAPI)
  backend:
    # Construye a partir de la carpeta backend
    build:
      context: ./api
      dockerfile: Dockerfile
    # Comando de inicio de Uvicorn para FastAPI
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      # Mapea el puerto 8000 del contenedor al puerto 8000 del host (opcional, para depuración)
      - "8000:8000"
    environment:
      - RUNPOD_API_URL=${RUNPOD_API_URL}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - MOCKED_RESPONSE=false
      # --- Database Configuration (Required for Reprompt) ---
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      # Uses the 'db' service name by default when running with Compose.
      # Override with 'host.docker.internal' to connect to a DB on the host.
      - DB_HOST=${DB_HOST:-db}
      # --- LLM Provider Keys (Required for Reprompt) ---
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
